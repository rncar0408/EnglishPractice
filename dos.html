<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Prueba Feriados</title>
</head>

<body>
    <h1>Feriados 2025</h1>
    <ul id="feriados"></ul>

    <script>
        fetch('https://api.argentinadatos.com/v1/feriados/2025')
            .then(response => response.json())
            .then(data => {
                const lista = document.getElementById('feriados');
                data.forEach(feriado => {
                    const li = document.createElement('li');
                    li.textContent = `${feriado.fecha} - ${feriado.nombre}`;
                    lista.appendChild(li);
                });
            })
            .catch(error => console.error('Error al obtener feriados:', error));
    </script>

            class="loader-genially" autoplay="autoplay" loop="loop" playsinline="playsInline" muted="muted"
            style="position: absolute;top: 45%;left: 50%;transform: translate(-50%, -50%);width: 80px;height: 80px;margin-bottom: 10%">
            <source src="https://static.genially.com/resources/loader-default-rebranding.mp4" type="video/mp4" />Your
            browser does not support the video tag.
        </video>
        <div id="6810fb7c919c17defbe28ed6" class="genially-embed"
            style="margin: 0px auto; position: relative; height: auto; width: 100%;"></div>
    </div>

</body>

</html>
