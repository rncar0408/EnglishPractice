<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚀 Advanced English Trainer (Voz Afina) 🚀</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗣️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>🚀 Advanced English Trainer 🚀</h1>

        <div class="section" id="category-selection">
            <h2>Elige tu Práctica</h2>
            <div class="button-grid">
                <button onclick="askQuestion('comparative')">📈 Comparativos</button>
                <button onclick="askQuestion('tense')">⏳ Tiempos Verbales</button>
                <button onclick="askQuestion('conditional')">❓ Condicionales</button>
                <button onclick="askQuestion('preposition')">📍 Preposiciones</button>
                <button onclick="askQuestion('phrasal')">🗣️ Phrasal Verbs</button>
                <button onclick="askQuestion('speaking')">🎤 Speaking (Repetir)</button>
                <button onclick="askQuestion('conversation')">💬 Conversación</button>
                <button onclick="askQuestion('reading')">📖 Comprensión Lectora</button>
                <button onclick="askQuestion('translate-en')">EN → ES Traducir</button>
                <button onclick="askQuestion('translate-es')">ES → EN Traducir</button>
            </div>
        </div>

        <!-- Unified Question Section -->
        <div class="question-section" id="questionSection" style="display:none;">
            <div id="readingTextContainer" style="display: none;"></div>
            <div id="readingControls" style="display: none;"> <button id="readAloudBtn" onclick="readAloudText()">🔊
                    Leer Texto en Voz Alta</button> </div>
            <p id="questionText"></p>
            <p id="comprehensionQuestion" style="display: none;"></p>
            <input type="text" id="answerInput" style="display: none;" placeholder="Escribe tu respuesta aquí..."
                onkeydown="if(event.key === 'Enter' && !document.getElementById('submitAnswerBtn').disabled) checkAnswer()">
            <p id="feedback" style="display: none;"></p>
            <div id="speechFeedbackArea" style="display: none;"></div>
            <div id="speakingControls" style="display: none;"> <button id="startSpeakingBtn"
                    onclick="startSpeechRecognition()">🎤 Empezar a Hablar</button> </div>
            <div id="conversationControls" style="display: none;"> <button id="listenQuestionBtn"
                    onclick="listenToQuestion()">🔊 Escuchar Pregunta</button> <button id="recordAnswerBtn"
                    onclick="startSpeechRecognition()" disabled>🎙️ Grabar Respuesta</button> </div>
            <div class="action-buttons"> <button id="submitAnswerBtn" style="display: none;" onclick="checkAnswer()">✅
                    Enviar</button> <button id="nextQuestionBtn" style="display: none;"
                    onclick="askNextQuestion()">Siguiente ➡️</button> </div>
        </div>
    </div>
</body>

</html>
